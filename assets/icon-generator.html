<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Generador de iconos — Hábitos</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f4f1ec; }
    h1 { color: #445a3c; }
    .icon-row { display: flex; gap: 2rem; flex-wrap: wrap; margin: 2rem 0; }
    .icon-box { text-align: center; }
    canvas { border: 1px solid #ccc; border-radius: 8px; display: block; margin-bottom: 0.5rem; }
    button {
      background: #445a3c; color: white; border: none;
      padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    p { color: #555; max-width: 480px; }
  </style>
</head>
<body>
  <h1>Generador de iconos PWA</h1>
  <p>Descarga los dos PNG y colócalos en la carpeta <code>assets/</code> del proyecto. Solo necesitas hacer esto una vez.</p>

  <div class="icon-row">
    <div class="icon-box">
      <canvas id="c192" width="192" height="192"></canvas>
      <button onclick="download('c192','icon-192.png')">Descargar icon-192.png</button>
    </div>
    <div class="icon-box">
      <canvas id="c512" width="512" height="512"></canvas>
      <button onclick="download('c512','icon-512.png')">Descargar icon-512.png</button>
    </div>
  </div>

  <script>
    function drawIcon(canvas) {
      const s = canvas.width;
      const ctx = canvas.getContext('2d');
      const r = s * 0.25; // border-radius proporcional

      // Fondo redondeado
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(s - r, 0);
      ctx.quadraticCurveTo(s, 0, s, r);
      ctx.lineTo(s, s - r);
      ctx.quadraticCurveTo(s, s, s - r, s);
      ctx.lineTo(r, s);
      ctx.quadraticCurveTo(0, s, 0, s - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#f4f1ec';
      ctx.fill();

      // Escalar el trazo del icono proporcionalmente (diseño original: 32x32)
      const scale = s / 32;
      ctx.save();
      ctx.scale(scale, scale);
      ctx.strokeStyle = '#445a3c';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Curva hoja: M8 24c2-9 7-14 16-15-1 9-6 14-15 16
      ctx.beginPath();
      ctx.moveTo(8, 24);
      ctx.bezierCurveTo(10, 15, 15, 10, 24, 9);
      ctx.bezierCurveTo(23, 18, 18, 23, 8, 24); // no fill
      ctx.stroke();

      // Tallo: M8 24l7-7
      ctx.beginPath();
      ctx.moveTo(8, 24);
      ctx.lineTo(15, 17);
      ctx.stroke();

      ctx.restore();
    }

    function download(id, filename) {
      const canvas = document.getElementById(id);
      const a = document.createElement('a');
      a.download = filename;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    drawIcon(document.getElementById('c192'));
    drawIcon(document.getElementById('c512'));
  </script>
</body>
</html>
