<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hábitos</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#445a3c" />
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hábitos" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <!-- Auth view — rendered by JS -->
  <div id="view-auth" class="view hidden"></div>

  <!-- Onboarding view — rendered by JS -->
  <div id="view-onboarding" class="view hidden"></div>

  <!-- Main app view -->
  <div id="view-app" class="view hidden">
    <div id="app-content"></div>
    <div id="tab-bar"></div>
  </div>

  <!-- Full-screen overlays (slide in from right) -->
  <div id="overlay-detail" class="overlay hidden"></div>
  <div id="overlay-create" class="overlay hidden"></div>
  <div id="overlay-members" class="overlay hidden"></div>

  <!-- Sheet modals (slide up from bottom) -->
  <div id="sheet-profile"></div>
  <div id="sheet-value"></div>
  <div id="sheet-quick"></div>
  <div id="sheet-add"></div>

  <!-- Toast notification -->
  <div id="toast"></div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"
        integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil"
        crossorigin="anonymous"></script>
<!-- App scripts -->
<script src="assets/icons.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/habits.js"></script>
<script src="js/logs.js"></script>
<script src="assets/qrcodegen.js"></script>
<script src="js/family.js"></script>
<script src="js/tasks.js"></script>
<script src="js/shopping.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/tareas/sw.js', { scope: '/tareas/' });
    });
  }
</script>
</body>
</html>
