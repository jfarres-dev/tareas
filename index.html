<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hábitos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f4f1ec'/><path d='M8 24c2-9 7-14 16-15-1 9-6 14-15 16M8 24l7-7' stroke='%23445a3c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <!-- Auth view — rendered by JS -->
  <div id="view-auth" class="view hidden"></div>

  <!-- Onboarding view — rendered by JS -->
  <div id="view-onboarding" class="view hidden"></div>

  <!-- Main app view -->
  <div id="view-app" class="view hidden">
    <div id="app-content"></div>
    <div id="tab-bar"></div>
  </div>

  <!-- Full-screen overlays (slide in from right) -->
  <div id="overlay-detail" class="overlay hidden"></div>
  <div id="overlay-create" class="overlay hidden"></div>

  <!-- Sheet modals (slide up from bottom) -->
  <div id="sheet-profile"></div>
  <div id="sheet-value"></div>

  <!-- Toast notification -->
  <div id="toast"></div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- App scripts -->
<script src="assets/icons.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/habits.js"></script>
<script src="js/logs.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
